<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supply Chain Demand Forecasting</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .header {
            text-align: center;
            padding: 40px 20px;
            color: white;
        }
        
        .header h1 {
            font-size: 2.2em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        
        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }
        
        .card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin: 20px 0;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .card h2 {
            color: #667eea;
            margin-bottom: 25px;
            font-size: 1.4em;
            text-align: center;
        }
        
        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 25px;
        }
        
        .form-group {
            margin-bottom: 5px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
            font-size: 0.95em;
        }
        
        .form-group select,
        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            transition: all 0.3s;
            background: #fafafa;
        }
        
        .form-group select:focus,
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .btn {
            display: block;
            width: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .results {
            display: none;
            margin-top: 25px;
        }
        
        .results.show {
            display: block;
        }
        
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin: 20px 0;
        }
        
        .metric-card {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            padding: 20px;
            border-radius: 12px;
            text-align: center;
        }
        
        .metric-card .value {
            font-size: 1.8em;
            font-weight: bold;
            color: #667eea;
        }
        
        .metric-card .label {
            font-size: 0.85em;
            color: #666;
            margin-top: 5px;
        }
        
        .predictions-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            border-radius: 10px;
            overflow: hidden;
        }
        
        .predictions-table th,
        .predictions-table td {
            padding: 14px 15px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
        }
        
        .predictions-table th {
            background: #667eea;
            color: white;
            font-weight: 600;
            font-size: 0.9em;
        }
        
        .predictions-table tr:hover {
            background: #f8f9ff;
        }
        
        .predictions-table td:last-child {
            font-weight: 600;
            color: #333;
        }
        
        .loading {
            display: none;
            text-align: center;
            padding: 30px;
        }
        
        .loading.show {
            display: block;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .section-title {
            color: #555;
            font-size: 1.1em;
            margin: 20px 0 10px;
        }
        
        @media (max-width: 600px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
            .metrics-grid {
                grid-template-columns: 1fr;
            }
            .header h1 {
                font-size: 1.6em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📦 Supply Chain Demand Forecasting</h1>
            <p>AI-Powered Demand Prediction using LSTM, XGBoost & Temporal Fusion Transformer</p>
        </div>
        
        <div class="card">
            <h2>🎯 Generate Demand Forecast</h2>
            
            <div class="form-grid">
                <div class="form-group">
                    <label for="model">🤖 AI Model</label>
                    <select id="model">
                        <option value="lstm">LSTM (Deep Learning)</option>
                        <option value="xgboost">XGBoost (Gradient Boosting)</option>
                        <option value="tft">TFT (Transformer)</option>
                        <option value="ensemble">Ensemble (All Models)</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="product">📦 Product ID</label>
                    <select id="product">
                        <option value="1">Product 1</option>
                        <option value="2">Product 2</option>
                        <option value="3">Product 3</option>
                        <option value="4">Product 4</option>
                        <option value="5">Product 5</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="store">🏪 Store ID</label>
                    <select id="store">
                        <option value="1">Store 1</option>
                        <option value="2">Store 2</option>
                        <option value="3">Store 3</option>
                        <option value="4">Store 4</option>
                        <option value="5">Store 5</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="days">📅 Forecast Days</label>
                    <input type="number" id="days" value="7" min="1" max="30">
                </div>
            </div>
            
            <button class="btn" onclick="generateForecast()">🔮 Generate Forecast</button>
            
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>AI is analyzing demand patterns...</p>
            </div>
            
            <div class="results" id="results">
                <div class="metrics-grid" id="metricsGrid"></div>
                
                <h4 class="section-title">📅 Daily Predictions</h4>
                <table class="predictions-table" id="predictionsTable">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Predicted Demand (Units)</th>
                        </tr>
                    </thead>
                    <tbody id="predictionsBody"></tbody>
                </table>
            </div>
        </div>
    </div>
    
    <script>
        async function generateForecast() {
            const model = document.getElementById('model').value;
            const product = document.getElementById('product').value;
            const store = document.getElementById('store').value;
            const days = document.getElementById('days').value;
            
            // Show loading
            document.getElementById('loading').classList.add('show');
            document.getElementById('results').classList.remove('show');
            
            try {
                const response = await fetch('/api/forecast', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        model: model,
                        product_id: parseInt(product),
                        store_id: parseInt(store),
                        forecast_days: parseInt(days)
                    })
                });
                
                const data = await response.json();
                
                if (data.error) {
                    alert('Error: ' + data.error);
                    return;
                }
                
                // Display results
                displayResults(data);
                
            } catch (error) {
                alert('Error generating forecast: ' + error.message);
            } finally {
                document.getElementById('loading').classList.remove('show');
            }
        }
        
        function displayResults(data) {
            // Show results section
            document.getElementById('results').classList.add('show');
            
            // Update metrics
            const metricsGrid = document.getElementById('metricsGrid');
            metricsGrid.innerHTML = `
                <div class="metric-card">
                    <div class="value">${data.total_demand.toLocaleString()}</div>
                    <div class="label">Total ${data.forecast_days}-Day Demand</div>
                </div>
                <div class="metric-card">
                    <div class="value">${data.avg_daily_demand.toLocaleString()}</div>
                    <div class="label">Avg Daily Demand</div>
                </div>
                <div class="metric-card">
                    <div class="value">${data.forecast_days}</div>
                    <div class="label">Forecast Horizon (Days)</div>
                </div>
                <div class="metric-card">
                    <div class="value">${data.model.split(' ')[0]}</div>
                    <div class="label">Model Used</div>
                </div>
            `;
            
            // Update predictions table
            const predictionsBody = document.getElementById('predictionsBody');
            predictionsBody.innerHTML = data.dates.map((date, i) => `
                <tr>
                    <td><strong>${date}</strong></td>
                    <td>${data.predictions[i].toLocaleString()} units</td>
                </tr>
            `).join('');
        }
    </script>
</body>
</html>
